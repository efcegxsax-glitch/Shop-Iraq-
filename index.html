<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>واجهة تطبيق جوال حقيقية وحيوية</title>

    <!-- التحقق الفوري المباشر قبل تحميل أي عنصر لتجنب إظهار الواجهة إطلاقاً في حال كان المستخدم مسجلاً -->
    <script>
        if (localStorage.getItem('app_active_user_uid')) {
            document.documentElement.style.display = 'none';
            window.location.replace('home.html');
        }
    </script>
    
    <!-- خط Cairo الاحترافي لدعم النصوص العربية -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- مكتبة الأيقونات للحقول والأزرار -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        /* إعدادات تصفير الهوامش وتأمين أبعاد شاشات الموبايل */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* قفل الشاشة تماماً لتتصرف كتطبيق حقيقي بدون سكرول عشوائي */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #FFFFFF;
        }

        /* حاوية التطبيق الحرة - تملأ كامل شاشة الهاتف */
        .app-container {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background-color: #FFFFFF;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ------------------------------------------------ */
        /* [ تأثيرات الظهور التدريجي عند فتح التطبيق أول مرة ] */
        /* ------------------------------------------------ */
        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ------------------------------------------------ */
        /* [1] قسم رأس التطبيق (الصورة والعناوين) */
        /* ------------------------------------------------ */
        .app-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding-top: 25px;
            opacity: 0;
            animation: slideUpFade 0.5s cubic-bezier(0.1, 0.76, 0.55, 0.94) forwards;
        }

        .image-wrapper {
            width: 100%;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* تقليص ذكي وانسيابي للصورة في وضع إنشاء الحساب */
        .signup-mode .image-wrapper {
            height: 100px;
        }

        .text-wrapper {
            text-align: center;
            padding: 12px 24px 4px 24px;
        }

        .main-title {
            font-size: 22px;
            font-weight: 700;
            color: #1A1D20;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .subtitle {
            font-size: 13.5px;
            font-weight: 400;
            color: #8A8D91;
            margin-top: 2px;
            transition: opacity 0.2s ease;
        }

        /* كلاس مساعد لإخفاء النصوص مؤقتاً أثناء الأنيميشن */
        .text-fade {
            opacity: 0;
            transform: translateY(-4px);
        }

        /* ------------------------------------------------ */
        /* [2] استمارة الحقول والأزرار القياسية للموبايل */
        /* ------------------------------------------------ */
        .form-content {
            padding: 10px 24px;
            display: flex;
            flex-direction: column;
            opacity: 0;
            animation: slideUpFade 0.5s cubic-bezier(0.1, 0.76, 0.55, 0.94) 0.1s forwards;
        }

        .input-box {
            position: relative;
            margin-bottom: 12px;
            width: 100%;
        }

        /* حقل الاسم المنزلق */
        .name-field {
            max-height: 0;
            opacity: 0;
            margin-bottom: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), 
                        opacity 0.25s ease, 
                        margin-bottom 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* إظهار حقل الاسم بشكل انسيابي */
        .signup-mode .name-field {
            max-height: 50px;
            opacity: 1;
            margin-bottom: 12px;
        }

        .input-box input {
            width: 100%;
            height: 50px;
            border: 1px solid #E2E4E8;
            border-radius: 14px;
            padding-right: 16px;
            padding-left: 46px;
            font-size: 15px;
            color: #1A1D20;
            outline: none;
            background-color: #FDFDFD;
            transition: border-color 0.25s ease, background-color 0.25s ease, box-shadow 0.25s ease;
        }

        .input-box input:focus {
            border-color: #FFC425;
            background-color: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(255, 196, 37, 0.08);
        }

        .input-box .icon-left {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #1A1D20;
            font-size: 16px;
        }

        .input-box.password-field input,
        .input-box.name-field input {
            padding-right: 46px;
        }

        .input-box .icon-right {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #1A1D20;
            font-size: 16px;
            cursor: pointer;
        }

        .forgot-link {
            text-align: right;
            margin-top: -4px;
            margin-bottom: 14px;
            transition: all 0.3s ease;
        }

        .signup-mode .forgot-link {
            max-height: 0;
            margin-bottom: 0;
            opacity: 0;
            overflow: hidden;
            pointer-events: none;
        }

        /* زر الإجراء الرئيسي */
        .btn-primary {
            width: 100%;
            height: 50px;
            background-color: #FFC425;
            border: none;
            border-radius: 14px;
            color: #1A1D20;
            font-size: 15.5px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(255, 196, 37, 0.15);
            transition: transform 0.1s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-primary:active {
            transform: scale(0.96);
            box-shadow: 0 2px 6px rgba(255, 196, 37, 0.05);
        }

        .btn-primary.loading {
            background-color: #E2E4E8;
            color: #8A8D91;
            box-shadow: none;
            pointer-events: none;
        }

        /* ------------------------------------------------ */
        /* [3] خيارات تسجيل الدخول الاجتماعي */
        /* ------------------------------------------------ */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 8px 24px;
            opacity: 0;
            animation: slideUpFade 0.5s cubic-bezier(0.1, 0.76, 0.55, 0.94) 0.2s forwards;
        }

        .divider span {
            padding: 0 12px;
            color: #8A8D91;
            font-size: 13px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #E2E4E8;
        }

        .social-wrap {
            display: flex;
            gap: 12px;
            padding: 0 24px;
            margin-bottom: 12px;
            opacity: 0;
            animation: slideUpFade 0.5s cubic-bezier(0.1, 0.76, 0.55, 0.94) 0.25s forwards;
        }

        .btn-social {
            flex: 1;
            height: 46px;
            border: 1px solid #E2E4E8;
            border-radius: 14px;
            background-color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #1A1D20;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .btn-social:active {
            transform: scale(0.96);
            background-color: #F8F9FA;
        }

        .fa-facebook {
            color: #1877F2;
            font-size: 17px;
        }

        /* ------------------------------------------------ */
        /* [4] تذييل التطبيق والموجة السفلية المدمجة */
        /* ------------------------------------------------ */
        .app-footer {
            width: 100%;
            display: flex;
            flex-direction: column;
            margin-top: auto;
            opacity: 0;
            animation: slideUpFade 0.5s cubic-bezier(0.1, 0.76, 0.55, 0.94) 0.3s forwards;
        }

        .toggle-prompt {
            text-align: center;
            font-size: 14px;
            color: #8A8D91;
            font-weight: 600;
            margin-bottom: 12px;
            z-index: 10;
        }

        .toggle-prompt a {
            color: #FFC425;
            text-decoration: none;
            font-weight: 700;
            margin-right: 4px;
            cursor: pointer;
            display: inline-block;
            transition: transform 0.1s ease;
        }

        .toggle-prompt a:active {
            transform: scale(0.95);
        }

        .wave-container {
            width: 100%;
            line-height: 0;
        }

        .wave-container svg {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="app-container" id="appModule">
        
        <!-- [1] قسم رأس التطبيق -->
        <div class="app-header">
            <div class="image-wrapper">
                <img src="https://i.postimg.cc/hGZ1SWZs/f13f7bb881cec437b20b52eaac441606.jpg" alt="App Illustration">
            </div>
            <div class="text-wrapper">
                <h1 class="main-title" id="titleText">مرحباً بك مجدداً</h1>
                <p class="subtitle" id="subText">سجِّل للدخول للمتابعة</p>
            </div>
        </div>

        <!-- [2] الحقول والأزرار القياسية للموبايل مع الأنيميشن -->
        <div class="form-content">
            <form onsubmit="onFormSubmit(event)">
                
                <!-- حقل الاسم المنزلق -->
                <div class="input-box name-field" id="nameContainer">
                    <input type="text" id="nameInput" placeholder="الاسم الكامل">
                    <i class="fa-regular fa-user icon-right"></i>
                </div>

                <div class="input-box">
                    <input type="email" placeholder="البريد الإلكتروني" required>
                    <i class="fa-regular fa-envelope icon-left"></i>
                </div>

                <div class="input-box password-field">
                    <input type="password" id="passInput" placeholder="كلمة المرور" required>
                    <i class="fa-solid fa-lock icon-left"></i>
                    <i class="fa-regular fa-eye icon-right" onclick="viewPasswordToggle()"></i>
                </div>

                <div class="forgot-link">
                    <a href="#" onclick="alert('تم إرسال رابط إعادة تعيين كلمة المرور!')">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" id="mainActionBtn" class="btn-primary">تسجيل الدخول</button>
                
            </form>
        </div>

        <!-- [3] خط خيارات التواصل الاجتماعي -->
        <div class="divider">
            <span>أو سجِّل الدخول باستخدام</span>
        </div>

        <div class="social-wrap">
            <button class="btn-social" onclick="triggerSocial('Google')">
                <svg width="16" height="16" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Google
            </button>

            <button class="btn-social" onclick="triggerSocial('Facebook')">
                <i class="fa-brands fa-facebook"></i>
                Facebook
            </button>
        </div>

        <!-- [4] التذييل والموجة السفلية الملتصقة تماماً بالأسفل -->
        <div class="app-footer">
            <div class="toggle-prompt" id="switchPrompt">
                ليس لديك حساب؟<a href="#" onclick="changeMode(event)">إنشاء حساب</a>
            </div>
            <div class="wave-container">
                <svg viewBox="0 0 420 120" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
                    <path d="M0 45C90 100 280 40 420 75V120H0V45Z" fill="#FFF2CE" opacity="0.6"/>
                    <path d="M0 55C100 110 290 50 420 82V120H0V55Z" fill="#FFC425"/>
                    <path d="M0 72C110 123 300 70 420 100V120H0V72Z" fill="#1A1D20"/>
                </svg>
            </div>
        </div>

    </div>

    <!-- تهيئة الفايربيس وربطه مع واجهة الدخول والحفظ الدائم للجلسة -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-analytics.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBo9t1b_Y4YZQLigluUMHekcKqDSV8Pn7s",
            authDomain: "shop-iraq-86dd8.firebaseapp.com",
            databaseURL: "https://shop-iraq-86dd8-default-rtdb.firebaseio.com",
            projectId: "shop-iraq-86dd8",
            storageBucket: "shop-iraq-86dd8.firebasestorage.app",
            messagingSenderId: "763958830934",
            appId: "1:763958830934:web:6622ef3125e26ce71018f7",
            measurementId: "G-55F4YEXMV9"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // معالجة نتيجة الدخول عبر إعادة التوجيه لقوقل على الموبايل
        getRedirectResult(auth).then(async (result) => {
            if (result && result.user) {
                const user = result.user;
                const snapshot = await get(child(ref(db), 'users/' + user.uid));
                if (!snapshot.exists()) {
                    const generatedId = '#IQ-' + Math.floor(1000000 + Math.random() * 9000000);
                    const userData = {
                        uid: user.uid,
                        name: user.displayName || 'مستخدم شوب العراق',
                        email: user.email || '',
                        userId: generatedId,
                        balance: 0,
                        points: 0,
                        banned: false,
                        banReason: 'مخالفة الشروط والأحكام العامة للتطبيق.',
                        managedStore: '',
                        avatar: user.photoURL || 'https://i.postimg.cc/hGZ1SWZs/f13f7bb881cec437b20b52eaac441606.jpg',
                        createdAt: new Date().toISOString()
                    };
                    await set(ref(db, 'users/' + user.uid), userData);
                }
                localStorage.setItem('app_active_user_uid', user.uid);
                window.location.href = 'home.html';
            }
        }).catch((err) => {
            console.error("Redirect result error: ", err);
        });

        // التحقق التلقائي اللحظي عند فتح التطبيق لإكمال الدخول مباشرة والانتقال إلى home.html بدون إظهار نموذج التسجيل
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                localStorage.setItem('app_active_user_uid', user.uid);
                try {
                    const snapshot = await get(child(ref(db), 'users/' + user.uid));
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        localStorage.setItem('app_user_balance', data.balance !== undefined ? data.balance : 0);
                        localStorage.setItem('app_user_points', data.points !== undefined ? data.points : 0);
                        localStorage.setItem('app_user_banned', data.banned ? 'true' : 'false');
                        localStorage.setItem('app_ban_reason', data.banReason || '');
                        localStorage.setItem('app_user_managed_store', data.managedStore || '');
                        localStorage.setItem('app_user_name', data.name || 'مستخدم شوب العراق');
                        localStorage.setItem('app_user_id_num', data.userId || '#IQ-8892401');
                    }
                } catch (err) {
                    console.error("Error fetching user session: ", err);
                }
                window.location.href = 'home.html';
            } else if (localStorage.getItem('app_active_user_uid')) {
                window.location.href = 'home.html';
            }
        });

        window.currentStatusSignUp = false;

        window.changeMode = function(event) {
            if(event) event.preventDefault();
            
            const appModule = document.getElementById('appModule');
            const titleText = document.getElementById('titleText');
            const subText = document.getElementById('subText');
            const mainActionBtn = document.getElementById('mainActionBtn');
            const switchPrompt = document.getElementById('switchPrompt');
            const nameInput = document.getElementById('nameInput');

            window.currentStatusSignUp = !window.currentStatusSignUp;

            titleText.classList.add('text-fade');
            subText.classList.add('text-fade');

            setTimeout(() => {
                if (window.currentStatusSignUp) {
                    appModule.classList.add('signup-mode');
                    titleText.textContent = 'إنشاء حساب جديد';
                    subText.textContent = 'أدخل بياناتك للانضمام إلينا';
                    mainActionBtn.textContent = 'إنشاء الحساب';
                    switchPrompt.innerHTML = 'لديك حساب بالفعل؟<a href="#" onclick="changeMode(event)">تسجيل الدخول</a>';
                    nameInput.required = true; 
                } else {
                    appModule.classList.remove('signup-mode');
                    titleText.textContent = 'مرحباً بك مجدداً';
                    subText.textContent = 'سجِّل للدخول للمتابعة';
                    mainActionBtn.textContent = 'تسجيل الدخول';
                    switchPrompt.innerHTML = 'ليس لديك حساب؟<a href="#" onclick="changeMode(event)">إنشاء حساب</a>';
                    nameInput.required = false; 
                }
                
                titleText.classList.remove('text-fade');
                subText.classList.remove('text-fade');
            }, 180);
        };

        window.viewPasswordToggle = function() {
            const passInput = document.getElementById('passInput');
            const toggleIcon = document.querySelector('.password-field .icon-right');
            
            if (passInput.type === 'password') {
                passInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        };

        window.onFormSubmit = async function(event) {
            event.preventDefault();
            const mainActionBtn = document.getElementById('mainActionBtn');
            const nameInput = document.getElementById('nameInput');
            const emailInput = document.querySelector('input[type="email"]');
            const passInput = document.getElementById('passInput');

            const email = emailInput.value.trim();
            const password = passInput.value;
            const fullName = nameInput.value.trim() || 'مستخدم شوب العراق';

            mainActionBtn.classList.add('loading');
            
            if (window.currentStatusSignUp) {
                mainActionBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري إنشاء الحساب...';
                try {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;
                    const generatedId = '#IQ-' + Math.floor(1000000 + Math.random() * 9000000);

                    const userData = {
                        uid: user.uid,
                        name: fullName,
                        email: email,
                        userId: generatedId,
                        balance: 0,
                        points: 0,
                        banned: false,
                        banReason: 'مخالفة الشروط والأحكام العامة للتطبيق.',
                        managedStore: '',
                        avatar: 'https://i.postimg.cc/hGZ1SWZs/f13f7bb881cec437b20b52eaac441606.jpg',
                        createdAt: new Date().toISOString()
                    };

                    await set(ref(db, 'users/' + user.uid), userData);

                    localStorage.setItem('app_active_user_uid', user.uid);
                    localStorage.setItem('app_user_balance', userData.balance);
                    localStorage.setItem('app_user_points', userData.points);
                    localStorage.setItem('app_user_banned', 'false');
                    localStorage.setItem('app_user_name', userData.name);
                    localStorage.setItem('app_user_id_num', userData.userId);

                    mainActionBtn.classList.remove('loading');
                    mainActionBtn.innerHTML = 'إنشاء الحساب';
                    alert('تم إنشاء حسابك بنجاح! 🎉');
                    window.location.href = 'home.html';
                    
                } catch (error) {
                    mainActionBtn.classList.remove('loading');
                    mainActionBtn.innerHTML = 'إنشاء الحساب';
                    alert('خطأ في إنشاء الحساب: ' + error.message);
                }
            } else {
                mainActionBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري تسجيل الدخول...';
                try {
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    const snapshot = await get(child(ref(db), 'users/' + user.uid));
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        localStorage.setItem('app_active_user_uid', user.uid);
                        localStorage.setItem('app_user_balance', data.balance !== undefined ? data.balance : 0);
                        localStorage.setItem('app_user_points', data.points !== undefined ? data.points : 0);
                        localStorage.setItem('app_user_banned', data.banned ? 'true' : 'false');
                        localStorage.setItem('app_ban_reason', data.banReason || '');
                        localStorage.setItem('app_user_managed_store', data.managedStore || '');
                        localStorage.setItem('app_user_name', data.name || 'مستخدم شوب العراق');
                        localStorage.setItem('app_user_id_num', data.userId || '#IQ-8892401');
                    } else {
                        localStorage.setItem('app_active_user_uid', user.uid);
                    }

                    mainActionBtn.classList.remove('loading');
                    mainActionBtn.innerHTML = 'تسجيل الدخول';
                    alert('تم تسجيل الدخول بنجاح! 🎉');
                    window.location.href = 'home.html';
                } catch (error) {
                    mainActionBtn.classList.remove('loading');
                    mainActionBtn.innerHTML = 'تسجيل الدخول';
                    alert('خطأ في تسجيل الدخول: ' + error.message);
                }
            }
        };

        window.triggerSocial = async function(name) {
            if (name === 'Google') {
                const provider = new GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                try {
                    const result = await signInWithPopup(auth, provider);
                    const user = result.user;
                    const snapshot = await get(child(ref(db), 'users/' + user.uid));
                    if (!snapshot.exists()) {
                        const generatedId = '#IQ-' + Math.floor(1000000 + Math.random() * 9000000);
                        const userData = {
                            uid: user.uid,
                            name: user.displayName || 'مستخدم شوب العراق',
                            email: user.email || '',
                            userId: generatedId,
                            balance: 0,
                            points: 0,
                            banned: false,
                            banReason: 'مخالفة الشروط والأحكام العامة للتطبيق.',
                            managedStore: '',
                            avatar: user.photoURL || 'https://i.postimg.cc/hGZ1SWZs/f13f7bb881cec437b20b52eaac441606.jpg',
                            createdAt: new Date().toISOString()
                        };
                        await set(ref(db, 'users/' + user.uid), userData);
                    }
                    localStorage.setItem('app_active_user_uid', user.uid);
                    alert('تم تسجيل الدخول بحساب Google بنجاح! 🎉');
                    window.location.href = 'home.html';
                } catch (error) {
                    if (error.code === 'auth/popup-blocked' || error.code === 'auth/popup-closed-by-user' || error.code === 'auth/cancelled-popup-request') {
                        try {
                            await signInWithRedirect(auth, provider);
                        } catch (redErr) {
                            alert('خطأ أثناء الاتصال بحساب Google: ' + redErr.message);
                        }
                    } else {
                        alert('خطأ أثناء الاتصال بحساب Google: ' + error.message);
                    }
                }
            } else {
                alert('جاري الاتصال بحسابك في ' + name + '...');
            }
        };
    </script>
