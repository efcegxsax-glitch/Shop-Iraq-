# The AI tutor's server. Deployed by .github/workflows/tutor-worker.yml on every push that
# touches this folder, once the repository has the CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# and ANTHROPIC_API_KEY secrets. The API key only ever lives in the Worker's secrets.
name = "isp-tutor"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
FIREBASE_PROJECT_ID = "iraqi-student-platform-9918d"
FIREBASE_DB_URL = "https://iraqi-student-platform-9918d-default-rtdb.firebaseio.com"
# the tutor's push messages (needs the ONESIGNAL_REST_API_KEY secret)
ONESIGNAL_APP_ID = "6ab91884-6fd7-43a1-a318-a4975260944e"
# the admin panel's account: only it may send pushes to every phone
ADMIN_EMAIL = "panel.admin@iraqi-student-platform.app"
APP_URL = "https://efcegxsax-glitch.github.io/Shop-Iraq-/"
# pages allowed to call the tutor (comma separated)
ALLOWED_ORIGINS = "https://efcegxsax-glitch.github.io,https://iraqi-student-platform-9918d.web.app,https://iraqi-student-platform-9918d.firebaseapp.com,https://localhost,capacitor://localhost"

# per student: at most 6 questions a minute
[[ratelimits]]
name = "PER_MINUTE"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

# per student: at most 10 voice-call relay requests a minute
[[ratelimits]]
name = "PER_CALL"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# the tutor's messages: 9:07, 13:07, 17:07 and 21:07 Baghdad time (UTC+3)
[triggers]
crons = ["7 6,10,14,18 * * *"]
