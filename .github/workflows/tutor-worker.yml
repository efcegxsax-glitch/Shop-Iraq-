# Deploys the AI tutor's server (tutor-worker/) to Cloudflare Workers whenever it changes,
# or by hand from the Actions tab. Needs three repository secrets (Settings -> Secrets and
# variables -> Actions): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ANTHROPIC_API_KEY.
# Until they exist the job skips itself instead of failing.
name: Deploy AI tutor
on:
  push:
    branches: [main]
    paths: ['tutor-worker/**', '.github/workflows/tutor-worker.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets are set
        id: chk
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$CF" ] && [ -n "$ACC" ] && [ -n "$KEY" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "::notice::AI tutor not deployed: add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and ANTHROPIC_API_KEY to the repository secrets."; fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.ok == '1'
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.ok == '1'
        with:
          node-version: 22
      - name: Install
        if: steps.chk.outputs.ok == '1'
        working-directory: tutor-worker
        run: npm ci --no-audit --no-fund
      - name: Deploy
        if: steps.chk.outputs.ok == '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tutor-worker
          secrets: |
            ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
