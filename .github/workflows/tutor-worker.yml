# Deploys the AI tutor's server (tutor-worker/) to Cloudflare Workers whenever it changes,
# or by hand from the Actions tab. Repository secrets (Settings -> Secrets and variables ->
# Actions): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and at least one model key:
# GEMINI_API_KEY (free tier) or ANTHROPIC_API_KEY. With both, the Worker uses Claude.
# Voice calls also use TURN_KEY_ID and TURN_KEY_API_TOKEN (Cloudflare -> Realtime -> TURN Server),
# when they are set, and the tutor's push messages use ONESIGNAL_REST_API_KEY (OneSignal ->
# Settings -> Keys & IDs). Until the required secrets exist the job skips itself instead of failing.
name: Deploy AI tutor
on:
  push:
    branches: [main]
    paths: ['tutor-worker/**', '.github/workflows/tutor-worker.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
      TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN }}
      ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Check the secrets are set
        id: chk
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && { [ -n "$GEMINI_API_KEY" ] || [ -n "$ANTHROPIC_API_KEY" ]; }; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "::notice::AI tutor not deployed: add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and GEMINI_API_KEY (or ANTHROPIC_API_KEY) to the repository secrets."; fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.ok == '1'
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.ok == '1'
        with:
          node-version: 22
      - name: Install
        if: steps.chk.outputs.ok == '1'
        working-directory: tutor-worker
        run: npm ci --no-audit --no-fund
      - name: Photo store for notifications (free Cloudflare KV, best effort)
        if: steps.chk.outputs.ok == '1'
        working-directory: tutor-worker
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?per_page=100" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const r=JSON.parse(s).result||[];const f=r.find(x=>x.title==="isp-avatars");console.log(f?f.id:"")}catch(e){console.log("")}})')
          if [ -z "$ID" ]; then
            ID=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d '{"title":"isp-avatars"}' "$API" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).result.id||"")}catch(e){console.log("")}})')
          fi
          if [ -n "$ID" ]; then
            sed -i "s/AVATARS_KV_ID/$ID/" wrangler.toml
            echo "photo store ready"
          else
            echo "::warning::Could not create the photo store (the Cloudflare token needs the Workers KV Storage: Edit permission). Pushes keep the app icon."
            python3 - <<'PY'
          import re
          s = open("wrangler.toml").read()
          s = re.sub(r"\[\[kv_namespaces\]\]\nbinding = \"AVATARS\"\nid = \"AVATARS_KV_ID\"\n", "", s)
          open("wrangler.toml", "w").write(s)
          PY
          fi
      - name: Deploy
        if: steps.chk.outputs.ok == '1'
        working-directory: tutor-worker
        run: npx wrangler deploy
      - name: Upload the model keys
        if: steps.chk.outputs.ok == '1'
        working-directory: tutor-worker
        run: |
          node -e '
            const o = {};
            for (const k of ["GEMINI_API_KEY", "ANTHROPIC_API_KEY", "TURN_KEY_ID", "TURN_KEY_API_TOKEN", "ONESIGNAL_REST_API_KEY", "YT_API_KEY", "FIREBASE_SA"]) if (process.env[k]) o[k] = process.env[k];
            require("fs").writeFileSync("keys.json", JSON.stringify(o), { mode: 0o600 });
          '
          npx wrangler secret bulk keys.json
          rm -f keys.json
