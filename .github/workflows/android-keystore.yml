# One time: makes the key that signs the Android app for Google Play and saves it in the repository
# (android-signing/upload.keystore). The file is locked with the password you put in the secret
# ANDROID_KEYSTORE_PASSWORD: make it long (20+ characters) and keep a copy of it somewhere safe.
# Google Play re-signs the app with its own key (Play App Signing), so this is only the "upload key".
name: Create Android signing key
on: workflow_dispatch
permissions:
  contents: write
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Make the key
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KS_PASS" || { echo "Add the secret ANDROID_KEYSTORE_PASSWORD first"; exit 1; }
          [ ${#KS_PASS} -ge 16 ] || { echo "The password is too short: use at least 16 characters"; exit 1; }
          test ! -f android-signing/upload.keystore || { echo "A key already exists. Never replace it."; exit 1; }
          mkdir -p android-signing
          keytool -genkeypair -v -storetype PKCS12 -keystore android-signing/upload.keystore -alias upload \
            -keyalg RSA -keysize 4096 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=Iraqi Student Platform, O=Iraqi Student Platform, C=IQ"
      - name: Save it in the repository
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add android-signing/upload.keystore
          git commit -m "Add the Android upload key (locked with the repository secret)"
          git push
